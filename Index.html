<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluedo - Page d'accueil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/iconcluedo.png" type="image/png">
</head>
<body>
    <div class="image-container">
        <img src="images/accueil.JPG" alt="Maison hantée" height="100%" width="100%">
        <div class="text">
            <h1>Bienvenue dans Cluedo</h1>
            <p>Résolvez le mystère : Qui ? Où ? Avec quoi ?<br>
            Cluedo est un jeu où les joueurs enquêtent pour découvrir qui a commis un meurtre, avec quelle arme, et dans quelle pièce du manoir.
            </p>
        </div>
        <div class="buttons">
            <button id="new-game" onclick="startNewGame()">Nouvelle Partie</button>
            <button id="rules" onclick="showRules()">Règles du Jeu</button>
        </div>
        <div class="signature">
            Zaïnabe MESSAOUDI
        </div>
    </div>
    <script>
        function startNewGame() {
            alert("Nouvelle partie commencée !");
            // Redirection vers la page selection_personnage.html
            window.location.href = "selection_personnage.html";
        }

        // Fonction pour afficher les règles du jeu
        function showRules() {
            alert("Le but du jeu est de découvrir qui a commis le meurtre, dans quelle pièce et avec quelle arme. Explorez les pièces, formulez des hypothèses, et trouvez la bonne combinaison pour gagner !");
        }
    </script>
</body>
</html>
